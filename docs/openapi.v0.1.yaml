openapi: 3.0.3
info:
  title: fault_assistant_AI Frontend Backend API
  version: 0.1.0
  description: |
    前端开工版接口契约（v0.1）。
    覆盖：鉴权、模型配置、Session 生命周期、消息发送、SSE 事件流、Skills/Tools/Artifacts。
servers:
  - url: http://localhost:8000
    description: Local
tags:
  - name: Auth
  - name: User
  - name: Models
  - name: Sessions
  - name: Messages
  - name: Skills
  - name: Tools
  - name: Artifacts
security:
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: 本地账号密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      responses:
        '204':
          description: 退出成功
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/me:
    get:
      tags: [User]
      summary: 获取当前用户信息
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/models/providers:
    get:
      tags: [Models]
      summary: 获取可用模型提供方
      responses:
        '200':
          description: 提供方列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelProvider'
                required: [items]
  /api/models/profiles:
    get:
      tags: [Models]
      summary: 获取可用模型配置
      responses:
        '200':
          description: profile 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  default_profile:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelProfile'
                required: [default_profile, items]

  /api/sessions:
    get:
      tags: [Sessions]
      summary: 获取会话列表（按分组）
      parameters:
        - $ref: '#/components/parameters/GroupFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/UserIdFilter'
      responses:
        '200':
          description: 分组会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionGroupedListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Sessions]
      summary: 创建新会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/sessions/{session_id}:
    get:
      tags: [Sessions]
      summary: 获取会话详情
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/sessions/{session_id}/control:
    post:
      tags: [Sessions]
      summary: 会话控制（pause/resume/cancel/rerun）
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionControlRequest'
      responses:
        '202':
          description: 控制命令已接收
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sessions/{session_id}/messages:
    post:
      tags: [Messages]
      summary: 发送消息并启动一次运行
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '202':
          description: 已进入队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sessions/{session_id}/events:
    get:
      tags: [Messages]
      summary: 订阅会话事件流（SSE）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: last_event_id
          in: query
          required: false
          schema:
            type: string
          description: 断线重连时使用
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: message.delta
                  data: {"session_id":"sess_1","run_id":"run_1","payload":{"delta":"你好"}}
        '404':
          $ref: '#/components/responses/NotFound'

  /api/skills:
    get:
      tags: [Skills]
      summary: 获取技能列表
      responses:
        '200':
          description: 技能列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Skill'
                required: [items]
  /api/skills/{skill_id}/markdown:
    put:
      tags: [Skills]
      summary: 更新技能 Markdown 文档（普通用户可编辑）
      parameters:
        - $ref: '#/components/parameters/SkillId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSkillMarkdownRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillMarkdownVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tools:
    get:
      tags: [Tools]
      summary: 获取工具列表
      responses:
        '200':
          description: 工具列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tool'
                required: [items]
    post:
      tags: [Tools]
      summary: 新增工具（管理员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToolRequest'
      responses:
        '201':
          description: 新增成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/tools/{tool_id}:
    delete:
      tags: [Tools]
      summary: 删除工具（管理员）
      parameters:
        - $ref: '#/components/parameters/ToolId'
      responses:
        '204':
          description: 删除成功
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/artifacts:
    get:
      tags: [Artifacts]
      summary: 查询结果产物
      parameters:
        - $ref: '#/components/parameters/AppIdFilter'
        - $ref: '#/components/parameters/SessionIdFilter'
        - $ref: '#/components/parameters/ArtifactTypeFilter'
        - $ref: '#/components/parameters/UserIdFilter'
        - $ref: '#/components/parameters/FromTime'
        - $ref: '#/components/parameters/ToTime'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 产物列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    SkillId:
      name: skill_id
      in: path
      required: true
      schema:
        type: string
    ToolId:
      name: tool_id
      in: path
      required: true
      schema:
        type: string
    GroupFilter:
      name: group
      in: query
      required: false
      schema:
        type: string
        enum: [running, recent, archived]
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortBy:
      name: sort_by
      in: query
      required: false
      schema:
        type: string
        enum: [created_at, updated_at]
        default: updated_at
    SortOrder:
      name: sort_order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    UserIdFilter:
      name: user_id
      in: query
      required: false
      schema:
        type: string
      description: 仅管理员可用
    AppIdFilter:
      name: app_id
      in: query
      required: false
      schema:
        type: string
    SessionIdFilter:
      name: session_id
      in: query
      required: false
      schema:
        type: string
    ArtifactTypeFilter:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum: [markdown, image, json, csv, video, other]
    FromTime:
      name: from_time
      in: query
      required: false
      schema:
        type: string
        format: date-time
    ToTime:
      name: to_time
      in: query
      required: false
      schema:
        type: string
        format: date-time

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未登录或 token 无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: FORBIDDEN
        message:
          type: string
          example: 当前用户无权限执行该操作
        trace_id:
          type: string
      required: [code, message]

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      required: [username, password]

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 7200
        user:
          $ref: '#/components/schemas/UserProfile'
      required: [access_token, token_type, expires_in, user]

    UserProfile:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        display_name:
          type: string
      required: [id, username, role]

    ModelProvider:
      type: object
      properties:
        id:
          type: string
          example: gemini
        name:
          type: string
          example: Gemini
      required: [id, name]

    ModelProfile:
      type: object
      properties:
        profile:
          type: string
          example: gemini_default
        provider:
          type: string
          example: gemini
        model:
          type: string
          example: gemini-1.5-flash
        visible_to_roles:
          type: array
          items:
            type: string
            enum: [admin, user]
      required: [profile, provider, model]

    Session:
      type: object
      properties:
        id:
          type: string
        owner_id:
          type: string
        app_id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [running, paused, completed, failed, cancelled]
        model_provider:
          type: string
        model_profile:
          type: string
        model_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, owner_id, app_id, status, model_provider, model_profile, model_name, created_at, updated_at]

    SessionStatistics:
      type: object
      properties:
        message_count:
          type: integer
        skill_calls:
          type: integer
        tool_calls:
          type: integer
        error_count:
          type: integer
        duration_ms:
          type: integer
        artifact_count:
          type: integer
      required: [message_count, skill_calls, tool_calls, error_count, duration_ms, artifact_count]

    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          properties:
            statistics:
              $ref: '#/components/schemas/SessionStatistics'
            last_message_preview:
              type: string

    SessionGroupedListResponse:
      type: object
      properties:
        running:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        recent:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        archived:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      required: [running, recent, archived, page, page_size, total]

    CreateSessionRequest:
      type: object
      properties:
        app_id:
          type: string
        title:
          type: string
        model_provider:
          type: string
          enum: [gemini, openai]
        model_profile:
          type: string
        model_name:
          type: string
        inputs:
          type: object
          additionalProperties: true
      required: [app_id]

    SessionControlRequest:
      type: object
      properties:
        action:
          type: string
          enum: [pause, resume, cancel, rerun]
      required: [action]

    SessionControlResponse:
      type: object
      properties:
        session_id:
          type: string
        action:
          type: string
        accepted:
          type: boolean
        status:
          type: string
      required: [session_id, action, accepted, status]

    CreateMessageRequest:
      type: object
      properties:
        content:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRef'
      required: [content]

    CreateMessageResponse:
      type: object
      properties:
        message_id:
          type: string
        run_id:
          type: string
        status:
          type: string
          enum: [queued, running]
      required: [message_id, run_id, status]

    AttachmentRef:
      type: object
      properties:
        artifact_id:
          type: string
      required: [artifact_id]

    Skill:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        markdown_path:
          type: string
      required: [id, name, enabled]

    UpdateSkillMarkdownRequest:
      type: object
      properties:
        content:
          type: string
        change_note:
          type: string
      required: [content]

    SkillMarkdownVersion:
      type: object
      properties:
        skill_id:
          type: string
        version_id:
          type: string
        updated_at:
          type: string
          format: date-time
      required: [skill_id, version_id, updated_at]

    Tool:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        schema:
          type: object
          additionalProperties: true
      required: [id, name, enabled]

    CreateToolRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        schema:
          type: object
          additionalProperties: true
      required: [name]

    Artifact:
      type: object
      properties:
        id:
          type: string
        session_id:
          type: string
        app_id:
          type: string
        type:
          type: string
          enum: [markdown, image, json, csv, video, other]
        path:
          type: string
        mime_type:
          type: string
        size:
          type: integer
        checksum:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, session_id, type, path, mime_type, size, created_by, created_at]

    ArtifactListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      required: [items, page, page_size, total]
