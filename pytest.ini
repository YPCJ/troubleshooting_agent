[pytest]
testpaths = backend/tests
python_files = test_*.py
# Tests import both `backend.*` packages and top-level modules that live inside
# Tests import modules from both the repository root and `backend/`.
pythonpath = . backend
# Unclosed SQLite handles leak checkpoint connections in production too, so keep
# them fatal rather than letting them pile up as ignorable noise.
filterwarnings =
    error::ResourceWarning
